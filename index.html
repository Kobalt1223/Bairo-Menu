<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR Cocktail Menu</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="menu">

        <h1>AR Cocktail Menu</h1>

        <button onclick="showDrink('margarita')">
            Margarita
        </button>

        <button onclick="showDrink('oldFashioned')">
            Old Fashioned
        </button>

        <button onclick="showDrink('negroni')">
            Negroni
        </button>

        <button onclick="showDrink('spritz')">
            Spritz
        </button>

        <button onclick="showDrink('french72')">
            French 72
        </button>

    </div>


    <div id="drink">

        <button onclick="backToMenu()">
            Back
        </button>

        <h2 id="drinkName"></h2>

        <model-viewer
            id="viewer"
            camera-controls
            auto-rotate
            autoplay
            ar>
        </model-viewer>

    </div>


    <script src="script.js"></script>

</body>

</html>
