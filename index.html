
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bairo Cocktail Menu</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>

    <div id="menu">
        <h1>Bairo Cocktail Menu</h1>
        <p>Select a cocktail</p>

        <button onclick="showDrink('margarita')">Margarita</button>
        <button onclick="showDrink('oldFashioned')">Old Fashioned</button>
        <button onclick="showDrink('negroni')">Negroni</button>
        <button onclick="showDrink('spritz')">Spritz</button>
        <button onclick="showDrink('french72')">French 72</button>
    </div>

    <div id="drink">
        <button onclick="backToMenu()">← Back to Menu</button>

        <h1 id="drinkName"></h1>

        <model-viewer
            id="viewer"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="1"
            loading="eager">
        </model-viewer>

        <p id="status">Loading model...</p>
        <p>Drag to rotate • Scroll or pinch to zoom</p>
    </div>

</body>
</html>
